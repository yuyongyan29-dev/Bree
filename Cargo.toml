[package]
name = "bree-cli"
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.96"
description = "Read-only local memory inspection for macOS"
license = "GPL-3.0-only"
repository = "https://github.com/yuyongyan29-dev/Bree"
publish = false

[[bin]]
name = "bree"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3.5", features = ["termination"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSDate", "NSRunLoop", "NSObject", "NSObjCRuntime"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
