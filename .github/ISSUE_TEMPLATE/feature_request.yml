name: Feature request
description: Describe a concrete problem you want Bree to help with
body:
  - type: textarea
    id: problem
    attributes:
      label: Current problem
      description: When does this happen, and how do you handle it today? Do not include secrets, environment variables, or personal paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
