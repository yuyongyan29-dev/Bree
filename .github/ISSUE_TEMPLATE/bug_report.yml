name: Bug report
description: Report an installation, memory collection, or interface problem
body:
  - type: input
    id: version
    attributes:
      label: Bree version
      description: bree --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System and installation method
      placeholder: macOS version, Apple Silicon model, Homebrew or curl
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce and actual results
      description: Include expected results and relevant error output. Do not include secrets, environment variables, or personal paths. Report security vulnerabilities privately using the Security report link in the issue chooser.
    validations:
      required: true
